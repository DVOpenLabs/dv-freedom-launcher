{
  "name": "Bug report",
  "description": "Report a problem with DV Freedom Launcher or Setup.",
  "labels": [
    "bug"
  ],
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "Please remove IP/MAC addresses, serial numbers, account details, pairing codes, certificates and tokens from screenshots/logs. Do not attach a full private recovery folder. State whether this is a browser preview or a physical TV test; untested hardware is not certified."
      }
    },
    {
      "type": "dropdown",
      "id": "platform",
      "attributes": {
        "label": "Platform",
        "options": [
          "Android TV / Google TV",
          "Google TV Streamer / Android box",
          "LG webOS",
          "Samsung Tizen",
          "Hisense VIDAA",
          "Vizio SmartCast",
          "Roku / Roku TV",
          "Setup GUI / browser preview",
          "Other / unsure"
        ]
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "version",
      "attributes": {
        "label": "DV Freedom version or commit"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "model",
      "attributes": {
        "label": "Device model and OS / firmware version",
        "description": "For a browser-only issue, give your computer OS and browser instead."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "dropdown",
      "id": "environment",
      "attributes": {
        "label": "Where did it happen?",
        "options": [
          "Physical TV / external box",
          "Setup GUI connected to a device",
          "Example journey / browser preview",
          "Source build or tests"
        ]
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "problem",
      "attributes": {
        "label": "What happened, and what did you expect?"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "steps",
      "attributes": {
        "label": "Steps to reproduce"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "evidence",
      "attributes": {
        "label": "Relevant screenshot or short log excerpt",
        "description": "Check for private data before attaching. Note any remote, playback or restart checks you did not perform."
      }
    }
  ]
}
