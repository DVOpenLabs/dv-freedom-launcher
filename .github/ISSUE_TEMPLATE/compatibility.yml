{
  "name": "TV compatibility feedback",
  "description": "Share model-specific results for any platform, including manual and experimental editions.",
  "title": "[Compatibility] ",
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "Please remove IP/MAC addresses, serial numbers, account details, pairing codes, certificates and tokens from screenshots/logs. Do not attach a full private recovery folder. State whether this is a browser preview or a physical TV test; untested hardware is not certified."
      }
    },
    {
      "type": "dropdown",
      "id": "platform",
      "attributes": {
        "label": "Platform",
        "options": [
          "Android TV / Google TV",
          "Google TV Streamer / Android box",
          "LG webOS",
          "Samsung Tizen",
          "Hisense VIDAA",
          "Vizio SmartCast",
          "Roku / Roku TV",
          "Setup GUI / browser preview",
          "Other / unsure"
        ]
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "model",
      "attributes": {
        "label": "Full product model code (not serial number)"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "firmware",
      "attributes": {
        "label": "OS and firmware version"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "version",
      "attributes": {
        "label": "DV Freedom version or commit"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "dropdown",
      "id": "environment",
      "attributes": {
        "label": "What did you test?",
        "options": [
          "Browser preview only",
          "Native app on TV / external box",
          "Hosted VIDAA / Vizio Home",
          "Roku ambient app",
          "Packaging / source only"
        ]
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "results",
      "attributes": {
        "label": "What worked and what failed?",
        "description": "Distinguish app launch, physical remote, playback, Back, Home, standby and cold boot. Write not tested when appropriate."
      },
      "validations": {
        "required": true
      }
    }
  ]
}
