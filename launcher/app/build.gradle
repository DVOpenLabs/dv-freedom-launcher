plugins {
    id 'com.android.application'
}
def communityFeatures = providers.gradleProperty('communityFeatures').map { it.toBoolean() }.getOrElse(false)
def freedomRelease = providers.gradleProperty('freedomRelease').map { it.toBoolean() }.getOrElse(false)
def selectedId = providers.gradleProperty('launcherApplicationId').getOrElse(communityFeatures ? 'com.dvopenlabs.freedomlauncher' : 'com.gathin.tvhome')
if (freedomRelease && (!communityFeatures || selectedId != 'com.dvopenlabs.freedomlauncher')) throw new GradleException('Freedom release signing is only for the standalone product identity')

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34
    sourceSets {
        main {
            java.srcDir communityFeatures ? 'src/community/java' : 'src/reference/java'
            if (communityFeatures) {
                java.exclude '**/SettingsNavigation.java'
            }
        }
        test { if (communityFeatures) java.srcDir 'src/communityTest/java' }
        release { if (communityFeatures) { res.srcDir 'src/community/res'; manifest.srcFile 'src/community/AndroidManifest.xml' } }
        debug { if (communityFeatures) { res.srcDir 'src/community/res'; manifest.srcFile 'src/community/AndroidManifest.xml' } }
    }

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist; see docs/devices/xiaomi-mitv-aetp0-dofus.md.
        applicationId selectedId
        minSdk 26
        targetSdk 34
        versionCode communityFeatures ? 22 : 13
        versionName communityFeatures ? '3.2-freedom-alpha21' : '3.0-community-alpha5'
    }

    signingConfigs {
        if (freedomRelease) {
            freedom {
                if (!System.getenv('DVFREEDOM_KEYSTORE') || !System.getenv('DVFREEDOM_KEY_PASSWORD')) throw new GradleException('Release signing material is required outside the repository')
                storeFile file(System.getenv('DVFREEDOM_KEYSTORE'))
                storeType 'PKCS12'
                storePassword System.getenv('DVFREEDOM_KEY_PASSWORD')
                keyAlias 'dv-freedom'
                keyPassword System.getenv('DVFREEDOM_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Explicit standalone releases use the external release key; compatible development pilots retain debug signing.
            signingConfig freedomRelease ? signingConfigs.freedom : signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
}
// Compact resource names while keeping runtime banners and named view IDs.
// Runs before APK packaging/signing with the SDK tool pinned by this project, not a downloaded plugin.
tasks.configureEach { task ->
    if (task.name == 'optimizeReleaseResources') {
        task.doLast {
            def archives = task.outputs.files.asFileTree.matching { include '**/*.ap_' }.files
            if (archives.size() != 1) throw new GradleException('Expected one optimized resource archive')
            def archive = archives.first()
            def temporary = new File(archive.parentFile, 'compact.ap_.tmp')
            def keep = new File(archive.parentFile, 'runtime-resource-names.cfg')
            def names = fileTree('src/main/res').files.findAll { it.name.startsWith('banner_') }
                    .collect { 'drawable/' + it.name.substring(0, it.name.lastIndexOf('.')) + '#no_collapse' }.unique().sort()
            // Retain view IDs for accessibility/UI tooling as well as runtime banner lookups.
            def symbols = new File(layout.buildDirectory.get().asFile, 'intermediates/runtime_symbol_list/release/processReleaseResources/R.txt')
            if (!symbols.isFile()) throw new GradleException('Missing resource symbols')
            names += symbols.readLines().findAll { it.startsWith('int id ') }.collect { 'id/' + it.split(' ')[2] + '#no_collapse' }
            keep.text = names.join('\n') + '\n'
            def suffix = System.getProperty('os.name').toLowerCase().contains('windows') ? '.exe' : ''
            def aapt = new File(android.sdkDirectory, 'build-tools/' + android.buildToolsVersion + '/aapt2' + suffix)
            // Android's complex-color loader requires a .xml suffix. AAPT path shortening can
            // remove it from the product's state-list colors, causing Home inflation to fail.
            // Keep the inherited reference artifact stable; product builds retain resource paths.
            def options = [aapt, 'optimize', '--collapse-resource-names', '--deduplicate-entry-values']
            if (!communityFeatures) options += '--shorten-resource-paths'
            options += ['--resources-config-path', keep, '-o', temporary, archive]
            exec { commandLine options }
            java.nio.file.Files.move(temporary.toPath(), archive.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
    }
}
