plugins {
    id 'com.android.application'
}
def communityFeatures = providers.gradleProperty('communityFeatures').map { it.toBoolean() }.getOrElse(false)
def freedomRelease = providers.gradleProperty('freedomRelease').map { it.toBoolean() }.getOrElse(false)
def selectedId = providers.gradleProperty('launcherApplicationId').getOrElse(communityFeatures ? 'com.dvopenlabs.freedomlauncher' : 'com.gathin.tvhome')
if (freedomRelease && (!communityFeatures || selectedId != 'com.dvopenlabs.freedomlauncher')) throw new GradleException('Freedom release signing is only for the standalone product identity')

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34
    sourceSets {
        main {
            java.srcDir communityFeatures ? 'src/community/java' : 'src/reference/java'
            if (communityFeatures) {
                java.exclude '**/SettingsNavigation.java'
            }
        }
        test { if (communityFeatures) java.srcDir 'src/communityTest/java' }
        release { if (communityFeatures) { res.srcDir 'src/community/res'; manifest.srcFile 'src/community/AndroidManifest.xml' } }
        debug { if (communityFeatures) { res.srcDir 'src/community/res'; manifest.srcFile 'src/community/AndroidManifest.xml' } }
    }

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist; see docs/devices/xiaomi-mitv-aetp0-dofus.md.
        applicationId selectedId
        minSdk 26
        targetSdk 34
        versionCode communityFeatures ? 33 : 13
        versionName communityFeatures ? '1.0.0' : '3.0-community-alpha5'
    }

    signingConfigs {
        if (freedomRelease) {
            freedom {
                if (!System.getenv('DVFREEDOM_KEYSTORE') || !System.getenv('DVFREEDOM_KEY_PASSWORD')) throw new GradleException('Release signing material is required outside the repository')
                storeFile file(System.getenv('DVFREEDOM_KEYSTORE'))
                storeType 'PKCS12'
                storePassword System.getenv('DVFREEDOM_KEY_PASSWORD')
                keyAlias 'dv-freedom'
                keyPassword System.getenv('DVFREEDOM_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Explicit standalone releases use the external release key; compatible development pilots retain debug signing.
            signingConfig freedomRelease ? signingConfigs.freedom : signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
}

// Check the merged manifest, including library contributions, before packaging a release.
// Companion permissions are separate; an opt-in product build has only these three additions.
def verifyReleasePermissions = tasks.register('verifyReleasePermissions') {
    dependsOn 'processReleaseManifest'
    doLast {
        def manifest = new File(layout.buildDirectory.get().asFile,
                'intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml')
        def parsed = new XmlParser(false, true).parse(manifest)
        def actual = parsed.children().findAll { it.name().toString().startsWith('uses-permission') }
                .collect { it.attributes().find { key, value -> key.toString() == '{http://schemas.android.com/apk/res/android}name' }?.value }.toSet()
        def expected = ['android.permission.ACCESS_NETWORK_STATE', 'android.permission.ACCESS_WIFI_STATE',
                'android.permission.ACCESS_FINE_LOCATION', 'android.permission.WRITE_SECURE_SETTINGS',
                'yandex.tv.permission.ACCESS_TV_SOURCE'].toSet()
        if (communityFeatures) expected += ['android.permission.READ_TV_LISTINGS',
                'com.dvopenlabs.cytv.weatherpreview.READ_WEATHER', 'com.dvopenlabs.freedom.companions.READ']
        if (actual != expected) throw new GradleException("Launcher permission contract changed: added=${actual - expected}, removed=${expected - actual}")
    }
}
tasks.configureEach { task ->
    if (task.name in ['assembleRelease', 'packageRelease', 'lintRelease']) task.dependsOn verifyReleasePermissions
}
// Compact resource names while keeping runtime banners and named view IDs.
// Runs before APK packaging/signing with the SDK tool pinned by this project, not a downloaded plugin.
tasks.configureEach { task ->
    if (task.name == 'optimizeReleaseResources') {
        task.doLast {
            def archives = task.outputs.files.asFileTree.matching { include '**/*.ap_' }.files
            if (archives.size() != 1) throw new GradleException('Expected one optimized resource archive')
            def archive = archives.first()
            def temporary = new File(archive.parentFile, 'compact.ap_.tmp')
            def keep = new File(archive.parentFile, 'runtime-resource-names.cfg')
            def names = fileTree('src/main/res').files.findAll { it.name.startsWith('banner_') }
                    .collect { 'drawable/' + it.name.substring(0, it.name.lastIndexOf('.')) + '#no_collapse' }.unique().sort()
            // Retain view IDs for accessibility/UI tooling as well as runtime banner lookups.
            def symbols = new File(layout.buildDirectory.get().asFile, 'intermediates/runtime_symbol_list/release/processReleaseResources/R.txt')
            if (!symbols.isFile()) throw new GradleException('Missing resource symbols')
            names += symbols.readLines().findAll { it.startsWith('int id ') }.collect { 'id/' + it.split(' ')[2] + '#no_collapse' }
            keep.text = names.join('\n') + '\n'
            def suffix = System.getProperty('os.name').toLowerCase().contains('windows') ? '.exe' : ''
            def aapt = new File(android.sdkDirectory, 'build-tools/' + android.buildToolsVersion + '/aapt2' + suffix)
            // Android's complex-color loader requires a .xml suffix. AAPT path shortening can
            // remove it from the product's state-list colors, causing Home inflation to fail.
            // Keep the inherited reference artifact stable; product builds retain resource paths.
            def options = [aapt, 'optimize', '--collapse-resource-names', '--deduplicate-entry-values']
            if (!communityFeatures) options += '--shorten-resource-paths'
            options += ['--resources-config-path', keep, '-o', temporary, archive]
            exec { commandLine options }

            java.nio.file.Files.move(temporary.toPath(), archive.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
    }
}

// Reference-only lossless compression, before re-signing with the same debug identity.
// Work in temporary files and replace the assembled APK only after payload and signer verification.
if (!communityFeatures) {
    tasks.configureEach { task ->
        if (task.name == 'packageRelease') task.doLast {
            def apk = new File(layout.buildDirectory.get().asFile, 'outputs/apk/release/app-release.apk')
            if (!apk.isFile()) throw new GradleException('Missing reference APK')
            def sdkTools = new File(android.sdkDirectory, 'build-tools/' + android.buildToolsVersion)
            def windows = System.getProperty('os.name').toLowerCase().contains('windows')
            def zipalign = new File(sdkTools, windows ? 'zipalign.exe' : 'zipalign')
            def apksigner = new File(sdkTools, windows ? 'apksigner.bat' : 'apksigner')
            def aligned = new File(apk.parentFile, 'reference-compressed.tmp')
            def signed = new File(apk.parentFile, 'reference-signed.tmp')
            def config = android.signingConfigs.debug
            def payload = { File file ->
                def result = [:]
                def zip = new java.util.zip.ZipFile(file)
                try {
                    zip.entries().each { entry ->
                        def n = entry.name
                        if (!entry.directory && !(n == 'META-INF/MANIFEST.MF' || n ==~ /META-INF\/[^\/]+\.(SF|RSA|DSA|EC)/)) {
                            def digest = java.security.MessageDigest.getInstance('SHA-256')
                            zip.getInputStream(entry).withCloseable { input ->
                                byte[] buffer = new byte[8192]
                                for (int count = input.read(buffer); count != -1; count = input.read(buffer)) digest.update(buffer, 0, count)
                            }
                            if (result.put(n, digest.digest().encodeHex().toString()) != null) throw new GradleException("Duplicate APK entry: $n")
                        }
                    }
                } finally { zip.close() }
                result
            }
            def certificate = { File file ->
                def output = new ByteArrayOutputStream()
                exec { commandLine apksigner, 'verify', '--print-certs', file; standardOutput = output }
                def line = output.toString('UTF-8').readLines().find { it.startsWith('Signer #1 certificate SHA-256 digest:') }
                if (!line) throw new GradleException('Could not verify APK signer')
                line
            }
            try {
                aligned.delete(); signed.delete()
                exec { commandLine zipalign, '-z', '-f', '4', apk, aligned }
                exec {
                    environment 'DV_REFERENCE_STORE_PASSWORD', config.storePassword
                    environment 'DV_REFERENCE_KEY_PASSWORD', config.keyPassword
                    commandLine apksigner, 'sign', '--ks', config.storeFile, '--ks-key-alias', config.keyAlias,
                            '--ks-pass', 'env:DV_REFERENCE_STORE_PASSWORD', '--key-pass', 'env:DV_REFERENCE_KEY_PASSWORD',
                            '--v4-signing-enabled', 'false', '--out', signed, aligned
                }
                exec { commandLine zipalign, '-c', '4', signed }
                if (payload(apk) != payload(signed)) throw new GradleException('Reference compression changed APK payload')
                if (certificate(apk) != certificate(signed)) throw new GradleException('Reference signer changed')
                if (signed.length() > 589824) throw new GradleException('Reference APK exceeds the 589824-byte limit')
                java.nio.file.Files.move(signed.toPath(), apk.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING,
                        java.nio.file.StandardCopyOption.ATOMIC_MOVE)
            } finally { aligned.delete(); signed.delete() }
        }
    }
}
