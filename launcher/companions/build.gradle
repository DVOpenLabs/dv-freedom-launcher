plugins { id 'com.android.application' }
android {
    namespace 'com.dvopenlabs.freedom.companions'
    compileSdk 34
    defaultConfig { applicationId 'com.dvopenlabs.freedom.companions'; minSdk 26; targetSdk 34; versionCode 3; versionName '0.1-alpha3' }
    buildTypes { release { minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'; signingConfig signingConfigs.debug } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation('net.sf.biweekly:biweekly:0.6.8') { exclude group: 'com.fasterxml.jackson.core' }
    implementation 'commons-codec:commons-codec:1.23.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
}
def notices = layout.buildDirectory.dir('generated/notices')
android.sourceSets.main.assets.srcDir notices
tasks.register('companionNotices') {
    def sources = fileTree('../../product/licenses') { include 'biweekly-*', 'vinnie-*', 'commons-codec-*', 'okhttp-*', 'okio-*', 'kotlin-*', 'annotations-*' }
    inputs.files(sources); outputs.dir(notices)
    doLast {
        def out = new File(notices.get().asFile, 'third-party-notices.txt');out.parentFile.mkdirs()
        out.setText(sources.files.sort { it.name }.collect { it.name + '\n\n' + it.getText('UTF-8') }.join('\n\n----------------\n\n'),'UTF-8')
    }
}
tasks.named('preBuild').configure { dependsOn 'companionNotices' }

apply from: rootProject.file('optional-ui.gradle')
